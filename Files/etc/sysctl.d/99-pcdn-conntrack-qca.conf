# PCDN 场景的 UDP 连接跟踪调优（qualcommax：QCA 与 LIBWRT 共用）
#
# 文件名带 -qca 以免与 ponwrt 源码 target/linux/airoha/base-files 下的
# 99-pcdn-conntrack-airoha.conf 混淆：那份是 airoha 用（UDP 10/60、TCP 全套、
# netdev_max_backlog=8192），由源码提供；本文件仅在 WRT_TARGET 为
# qualcommax 时由 WRT-CORE 注入，两者文件名不同、互不覆盖。
#
# 背景：PCDN 单机会开出上万条 UDP 流，而 ipq60xx 的硬件加速表只有
# IPv4 2048 + IPv6 2048 条，其余全部走软件转发，表现为 sirq 偏高。
#
# 2026-11-27 在 RE-SS-01（LibWrt 25.12-nss + ECM）实测：
#   60/180 → 30/60 后 conntrack 18.4k→8~13k，ECM 加速数不再顶满，
#   CPU 11.4%→9.3%（同期上行 8.9k→9.9k pps），PCDN 上行未受影响。
#
# 注意：文件名必须以 99 开头，保证在 11-nf-conntrack.conf（内含 60/180）之后生效。
# 回滚：删除本文件，或把两个值改回 60 / 180。
net.netfilter.nf_conntrack_udp_timeout=30
net.netfilter.nf_conntrack_udp_timeout_stream=60
